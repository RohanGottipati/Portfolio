    <noscript>My portfolio requires JavaScript for navigation. You can still reach me at rohan.gottipati@gmail.com.</noscript>
    <script>
      (function (location) {
        if (location.search[1] !== "/") return;
        var decoded = location.search
          .slice(1)
          .split("&")
          .map(function (value) {
            return value.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          "",
          location.pathname.slice(0, -1) + decoded + location.hash,
        );
      })(window.location);
    </script>
